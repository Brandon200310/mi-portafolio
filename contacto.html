
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandon Molina | Contacto - Portafolio Full Stack</title>
    <meta name="description" content="Contacta a Brandon Molina, estudiante de Ingeniería en Sistemas Informáticos en Santa Ana, para conversar sobre proyectos, aprendizaje y oportunidades.">
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>Brandon Ernesto Molina Pérez</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Formulario de contacto -->
        <section>
            <h2>Contacto</h2>

            <p>Puedes comunicarte conmigo por medio de este formulario.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Datos de contacto</legend>

                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>

                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </p>

                    <p>
                        <label for="asunto">Asunto:</label>
                        <select id="asunto" name="asunto">
                            <option value="empleo">Oferta de empleo</option>
                            <option value="proyecto">Proyecto</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>

                    <p>
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    </p>

                    <p>
                        <input type="checkbox" id="acepto" name="acepto" required>
                        <label for="acepto">Acepto que me contacten</label>
                    </p>
                </fieldset>

                <button type="submit">Enviar mensaje</button>
            </form>

            <p>
                También puedes visitar mi
                <a href="https://github.com/Brandon200310">GitHub</a>.
            </p>
        </section>
    </main>

    <!-- Pie de pagina -->
    <footer>
        <p>&copy; 2026 Brandon Molina - Santa Ana</p>
    </footer>

</body>
</html>
